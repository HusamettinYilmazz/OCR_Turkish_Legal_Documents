###########
# trained on RTX 5090 32GB VRAM
###########

### model
model_name_or_path: google/gemma-3-4b-it
use_fast_tokenizer: false
cache_dir: /workspace/cache/
trust_remote_code: true
# quantization_bit: 4              ##critical for P100

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128               ## more looks better (e.g. 96) but VRAM
lora_target: all

### dataset
dataset: ocr_finetune_train
eval_dataset: ocr_finetune_val
template: gemma3
cutoff_len: 12000
# max_samples: 50        ## for working validation
overwrite_cache: true
preprocessing_num_workers: 16

### output
# resume_from_checkpoint: /workspace/ocr-models-gemma-3-4b-it/checkpoint-100
output_dir: /workspace/ocr-models-gemma-3-4b-it/
logging_steps: 25
save_steps: 500
plot_loss: true
# overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8      ## Try 16 (bigger batch)
learning_rate: 1.0e-4
num_train_epochs: 15.0               ## Try more epocs 25
lr_scheduler_type: cosine
warmup_ratio: 0.1
# fp16: true      ## P100 doesn't support bf16
bf16: true
ddp_timeout: 180000000

### eval
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500

report_to: wandb
run_name: ocr-TLD-finetune-llamafactory_V1

push_to_hub: true
export_hub_model_id: "husammm/turkish-legal-documents-ocr-parser-1.0_V3"
hub_private_repo: true
hub_strategy: checkpoint